<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Part Counter">
<link rel="manifest" href="manifest.webmanifest">
<title>Part Counter</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;background:#050505}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,rgba(180,0,0,.22),transparent 35%),linear-gradient(180deg,#111 0%,#050505 60%,#000 100%);color:#fff;-webkit-tap-highlight-color:transparent}button,input{font:inherit}.app{max-width:430px;margin:0 auto;min-height:100vh;padding:22px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.title{font-size:28px;font-weight:750;letter-spacing:-.04em}.pill{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);border-radius:999px;color:rgba(255,255,255,.72);padding:8px 12px;font-size:13px}.parts{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.part{white-space:nowrap;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.07);border-radius:999px;color:rgba(255,255,255,.72);padding:12px 18px}.part.active{background:#fff;color:#000}.add{background:#b91c1c;color:#fff}.card{background:rgba(255,255,255,.055);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:24px;margin-top:14px}.center{text-align:center;padding:28px 0}.kicker{text-transform:uppercase;letter-spacing:.35em;color:rgba(255,255,255,.45);font-size:12px;margin-bottom:10px}.count{font-size:92px;font-weight:650;line-height:1;letter-spacing:-.06em}.name{margin-top:14px;color:rgba(255,255,255,.65);font-size:18px}.grid3{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:10px;margin-top:12px}.btn{min-height:58px;border:0;border-radius:999px;background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.1);font-size:28px}.btn.primary{min-height:92px;background:#b91c1c;font-size:42px}.btn:active,.part:active{transform:scale(.96)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.45)}.stat-num{font-size:34px;font-weight:650;margin-top:8px}.nav{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom))}.nav-inner{max-width:430px;margin:0 auto;display:flex;background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px}.nav button{flex:1;border:0;border-radius:999px;padding:11px 6px;background:transparent;color:rgba(255,255,255,.55);font-size:12px}.nav button.active{background:#fff;color:#000}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);padding:12px 0}.muted{color:rgba(255,255,255,.45);font-size:13px}.switch{width:62px;height:34px;border-radius:999px;background:rgba(255,255,255,.15);padding:4px}.switch.on{background:#b91c1c}.knob{width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}.switch.on .knob{transform:translateX(28px)}
</style>
</head>
<body>
<div id="app" class="app"></div>
<nav class="nav"><div class="nav-inner"><button data-page="dashboard" class="active">Zähler</button><button data-page="history">Verlauf</button><button data-page="settings">Setup</button></div></nav>
<script>
const $=s=>document.querySelector(s);let page='dashboard';const defaults=[{id:'screws',name:'Schrauben',count:0},{id:'bolts',name:'Bolzen',count:0},{id:'plates',name:'Bleche',count:0}];
let parts=JSON.parse(localStorage.getItem('counter.parts')||'null')||defaults;let history=JSON.parse(localStorage.getItem('counter.history')||'[]');let sound=JSON.parse(localStorage.getItem('counter.sound')||'true');let selected=parts[0]?.id||'screws';
function save(){localStorage.setItem('counter.parts',JSON.stringify(parts));localStorage.setItem('counter.history',JSON.stringify(history));localStorage.setItem('counter.sound',JSON.stringify(sound))}
function clickSound(){if(!sound)return;try{let C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(880,c.currentTime);o.frequency.exponentialRampToValueAtTime(1320,c.currentTime+.035);g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.055);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.06)}catch(e){}}
function addHistory(n,a){history=[{id:crypto.randomUUID(),partName:n,action:a,time:new Date().toLocaleTimeString('de-DE')},...history].slice(0,100)}
function current(){return parts.find(p=>p.id===selected)||parts[0]}
function change(d){let p=current();if(!p)return;if(d>0)clickSound();parts=parts.map(x=>x.id===p.id?{...x,count:Math.max(0,x.count+d)}:x);addHistory(p.name,d>0?'+1':'-1');save();render()}
function addPart(){let n=prompt('Name des Teils:');if(!n||!n.trim())return;let p={id:crypto.randomUUID(),name:n.trim(),count:0};parts=[...parts,p];selected=p.id;save();render()}
function reset(){let p=current();parts=parts.map(x=>x.id===p.id?{...x,count:0}:x);addHistory(p.name,'Reset');save();render()}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let p=current(),total=parts.reduce((s,x)=>s+x.count,0);let html=`<div class="top"><div class="title">Part Counter</div><div class="pill">${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
if(page==='dashboard')html+=`<div class="parts">${parts.map(x=>`<button class="part ${x.id===selected?'active':''}" onclick="selected='${x.id}';render()">${x.name}</button>`).join('')}<button class="part add" onclick="addPart()">+ Neu</button></div><section class="card"><div class="center"><div class="kicker">Aktueller Zähler</div><div class="count">${p.count}</div><div class="name">${p.name}</div></div><div class="grid3"><button class="btn" onclick="change(-1)">−</button><button class="btn primary" onclick="change(1)">+</button><button class="btn" onclick="reset()">↻</button></div></section><div class="stats"><section class="card"><div class="stat-title">Teiltypen</div><div class="stat-num">${parts.length}</div></section><section class="card"><div class="stat-title">Gesamt</div><div class="stat-num">${total}</div></section></div>`;
if(page==='history')html+=`<section class="card"><h2>Verlauf</h2>${history.length?history.slice(0,30).map(e=>`<div class="row"><div><b>${e.partName}</b><div class="muted">${e.time}</div></div><span>${e.action}</span></div>`).join(''):'<p class="muted">Noch kein Verlauf vorhanden.</p>'}</section>`;
if(page==='settings')html+=`<section class="card"><h2>Einstellungen</h2><div class="row"><div><b>Zählton</b><div class="muted">Kurzer Klickton</div></div><button class="switch ${sound?'on':''}" onclick="sound=!sound;save();render()"><span class="knob"></span></button></div><button class="btn" style="width:100%;font-size:16px;margin-top:22px" onclick="if(confirm('Alle Daten zurücksetzen?')){parts=defaults;history=[];selected=parts[0].id;save();render()}">Alle Daten zurücksetzen</button></section>`;
$('#app').innerHTML=html}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});render();
</script>
</body>
</html>
